<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water Module | Francisco Samagaio</title>
    <meta name="description" content="A modular personal app module for water tracking and future life metrics." />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Module • Water</p>
          <h1>Water</h1>
        </div>
        <div class="topbar-actions">
          <a class="ghost-link" href="../app/">App Home</a>
        </div>
      </header>

      <main class="dashboard-grid">
        <section class="card">
          <div class="card-header">
            <div>
              <p class="eyebrow">Quick Add</p>
              <h3>Fast actions</h3>
            </div>
          </div>
          <div class="quick-actions" id="quickActions"></div>
          <div class="manual-entry">
            <label for="manualAmount">Custom amount (ml)</label>
            <div class="manual-row">
              <input id="manualAmount" type="number" min="50" step="50" value="250" />
              <button class="btn btn-primary" id="saveManualBtn">Save</button>
            </div>
          </div>
        </section>

        <section class="card hero-card">
          <div class="hero-copy">
            <p class="eyebrow">Today</p>
            <h2 id="todayTotal">0 ml</h2>
            <p class="muted">Your daily hydration target is <strong id="goalValue">2500 ml</strong>.</p>
          </div>
          <div class="hero-stats">
            <div>
              <span class="stat-label">Remaining</span>
              <strong id="remainingValue">2500 ml</strong>
            </div>
            <div>
              <span class="stat-label">Progress</span>
              <strong id="percentageValue">0%</strong>
            </div>
          </div>
          <div class="progress-track" aria-label="Water progress">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="hero-footer">
            <span id="latestEntry">No entries yet.</span>
            <div class="muted small" id="connectionStatus">Connecting to API…</div>
          </div>
        </section>

        <section class="card">
          <div class="card-header">
            <div>
              <p class="eyebrow">Settings</p>
              <h3>Daily goal</h3>
            </div>
          </div>
          <label for="goalInput">Goal (ml)</label>
          <div class="manual-row">
            <input id="goalInput" type="number" min="500" step="100" value="2500" />
            <button class="btn btn-secondary" id="saveGoalBtn">Update</button>
          </div>
        </section>

        <section class="card history-card">
          <div class="card-header">
            <div>
              <p class="eyebrow">History</p>
              <h3>Recent entries</h3>
            </div>
          </div>
          <ul class="history-list" id="historyList"></ul>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
